<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Husnain 🎂</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
  *{margin:0; padding:0; box-sizing:border-box;}
  body{
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
    height:100vh; display:flex; justify-content:center; align-items:center; overflow:hidden;
  }
.box{
    background: white; padding:35px 25px; border-radius:30px;
    box-shadow: 0 15px 50px rgba(255,77,109,0.4); border: 3px solid #ffdde1;
    text-align:center; width:90%; max-width:420px; min-height:450px;
    display:flex; flex-direction:column; justify-content:space-between; z-index:2;
  }
.emoji{font-size:3.5em; margin-bottom:10px; animation: bounce 2s infinite;}
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
  h2{color:#d63384; font-size:1.6em; margin-bottom:15px;}
.shayari{color:#a61e4d; font-size:1.2em; line-height:2; margin-bottom:15px; font-weight:600;}
.wish{color:#333; font-size:1.1em; line-height:1.8; background:#fff0f3; padding:12px; border-radius:15px; border:2px dashed #ff4d6d;}
.btn{
    margin-top:25px; padding:14px 40px; background: linear-gradient(135deg, #ff4d6d, #ff758f);
    color: white; border: none; border-radius: 50px; font-size: 1.2em; cursor: pointer;
    box-shadow: 0 5px 15px rgba(255,77,109,0.4); font-family: 'Poppins';
  }
 input{
    padding:12px; border:2px solid #ff4d6d; border-radius:15px; font-size:1.1em;
    text-align:center; margin:15px 0; font-family: 'Poppins';
  }
.hidden{display:none;}

  /* Confetti */
 .confetti {
    position: fixed; width: 10px; height: 10px; background: #ff4d6d;
    top: -10px; animation: fall 3s linear forwards; z-index:1;
  }
  @keyframes fall {
    to { transform: translateY(100vh) rotate(720deg); opacity:0; }
  }
</style>
</head>
<body>

<!-- PASSWORD PAGE -->
<div class="box" id="passwordPage">
  <div class="emoji">🔒💝</div>
  <h2>Ye surprise sirf mere Husnain ke liye hai</h2>
  <p style="color:#666; margin-bottom:10px;">Main ne aap ke liye apne haathon se banaya hai<br>Password daal kar kholo</p>
  <input type="password" id="passInput" placeholder="Enter Password">
  <button class="btn" onclick="checkPass()">Kholo Jaan ❤️</button>
  <p id="error" style="color:red; margin-top:10px;"></p>
</div>

<!-- MAIN PAGES -->
<div class="box hidden" id="mainPage">
  <div id="card"></div>
</div>

<script>
const correctPass = "Husnain"; // Password

const pages = [
  {emoji:"🎉", shayari:"Husnain, aap aaye to meri duniya roshan ho gayi<br>Aap ki hansi se meri subah hoti hai", wish:"🎂 Happy Birthday mere Jaan! Aaj ka din sirf aap ka hai"},
  {emoji:"❤️", shayari:"Main kitni lucky hun na<br>Jo aap jaisa boyfriend mila mujhe", wish:"🌹 Aap mere liye dua hain, aur main aap ki. Allah humein hamesha sath rakhe"},
  {emoji:"🌹", shayari:"Aap ke bina ek din bhi sochun<br>To dil ghabra jata hai mera", wish:"✨ Allah kare aap ki har wish poori ho. Happy Birthday!"},
  {emoji:"💖", shayari:"Log kehte hain pyaar andha hota hai<br>Par main kehti hun pyaar me Husnain nazar aata hai", wish:"🎁 Mere taraf se chota sa tohfa. Pasand aaye to batana"},
  {emoji:"🥰", shayari:"Aap ki baatein, aap ki shayari<br>Sab kuch mujhe pagal kar deta hai", wish:"💫 Happy Birthday! Cake khao aur mujhe yaad karo"},
  {emoji:"🌸", shayari:"Main roz sochti hun<br>Allah ne aap ko mere liye hi banaya hai", wish:"🎈 Jaan aaj enjoy karo. Main dil se aap ke sath hun"},
  {emoji:"💌", shayari:"Aap mera ghar ho, mera sukoon ho<br>Aap meri sab se pyari aadat ho", wish:"🎊 Happy Birthday! Hamesha aise hi hanste raho"},
  {emoji:"✨", shayari:"Duniya me 8 billion log hain<br>Par mera dil sirf Husnain ko dhoondta hai", wish:"❤️ Aap ke liye meri dua: sehat, izzat aur kamyabi"},
  {emoji:"🎁", shayari:"Jis din aap paida hue<br>Us din farishton ne bhi party ki hogi", wish:"🌙 Allah aap ko lambi umar de. Ameen"},
  {emoji:"💕", shayari:"Aap ka naam sunte hi<br>Mere chehre par smile aa jati hai", wish:"🎂 Birthday Mubarak! Aaj sab se zyada pyaar main karungi"},
  {emoji:"🌙", shayari:"Tum mere ho is baat pe<br>Mujhe naaz hai Jaan", wish:"💝 Thank you har choti choti khushi ke liye"},
  {emoji:"🎈", shayari:"Aap naraz ho jao to<br>Main duniya bhar ke jatan karun", wish:"🌟 Happy Birthday mere hero! You deserve the world"},
  {emoji:"💫", shayari:"Mera sapna, meri dua, meri taqdeer<br>Sab kuch sirf aap ho Husnain", wish:"🎉 Celebrate karo Jaan! Main yahan se dua bhej rahi hun"},
  {emoji:"🌷", shayari:"Aap ke liye meri dua hai<br>Ke aap ko kabhi koi dukh na chhoo sake", wish:"❤️ Love You! Aap hamesha kamyab hon"},
  {emoji:"💞", shayari:"I Love You Husnain<br>Aap meri zindagi hain<br>Aap ke baghair main kuch bhi nahi", wish:"🎂🎉 Happy Birthday to the Best Boyfriend Ever! I Love You Endless ❤️\n\n- Aap ki"}
];

let i = 0;

function createConfetti() {
  for(let j=0; j<100; j++){
    let confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + 'vw';
    confetti.style.backgroundColor = ['#ff4d6d','#ff758f','#ffc2d1','#ffe5ec'][Math.floor(Math.random()*4)];
    confetti.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(confetti);
    setTimeout(()=>confetti.remove(), 3000);
  }
}

function checkPass(){
  const input = document.getElementById('passInput').value;
  if(input === correctPass){
    createConfetti(); // Party pop!
    document.getElementById('passwordPage').classList.add('hidden');
    document.getElementById('mainPage').classList.remove('hidden');
    showPage();
  } else {
    document.getElementById('error').innerText = "Oops! Galat password hai. Phir se try karo 😅";
  }
}

function showPage(){
  const p = pages[i];
  document.getElementById('card').innerHTML = `
    <div>
      <div class="emoji">${p.emoji}</div>
      <h2>Page ${i+1}</h2>
      <div class="shayari">${p.shayari}</div>
      <div class="wish">${p.wish}</div>
    </div>
    <div>
      ${i < pages.length-1? `<button class="btn" onclick="nextPage()">Next Page ➡️</button>` : `<button class="btn" onclick="alert('I Love You So Much Husnain! ❤️🎊\n\n- Aap ki')">Khatam 🎊</button>`}
      <div style="color:#999; font-size:0.9em; margin-top:10px;">${i+1} / ${pages.length}</div>
    </div>
  `;
}

function nextPage(){
  i++;
  if(i % 3 === 0) createConfetti(); // Har 3 page ke baad choti confetti
  showPage();
}

document.getElementById('passInput').addEventListener('keypress', function(e){
  if(e.key === 'Enter') checkPass();
});
</script>
</body>
</html>
