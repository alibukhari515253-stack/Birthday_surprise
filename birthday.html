<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 17th Birthday 🎂</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@600&display=swap');
body{
  margin:0; padding:0; 
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display:flex; justify-content:center; align-items:center; min-height:100vh;
  overflow:hidden;
  font-family: 'Poppins', sans-serif;
}
.box{
  background: white; 
  padding:30px 25px; 
  border-radius:30px; 
  text-align:center; 
  width:90%; 
  max-width:380px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
  animation: pop 0.8s ease;
  z-index:2;
}
@keyframes pop{ from{transform:scale(0.5); opacity:0;} to{transform:scale(1); opacity:1;} }

h1{
  font-family: 'Pacifico', cursive;
  font-size:2.2em; 
  color:#667eea; 
  margin:10px 0;
}
.age{
  font-size:5em; 
  font-weight:700; 
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin:10px 0;
}
p{color:#555; font-size:1em; line-height:1.7;}
.cake{font-size:5em; animation: bounce 2s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)}}

.btn{
  padding:14px 35px; 
  background: linear-gradient(135deg, #667eea, #764ba2);
  color:white; 
  border:none; 
  border-radius:50px; 
  font-size:1.1em; 
  font-weight:600;
  margin:8px;
  cursor:pointer;
  box-shadow:0 5px 20px rgba(102,126,234,0.4);
}

/* Keypad */
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:15px 0;}
.key{padding:15px; border:2px solid #667eea; border-radius:12px; background:#f0f0ff; font-size:18px; font-weight:bold; color:#667eea; cursor:pointer;}
.dots{display:flex; justify-content:center; gap:10px; margin:15px;}
.dot{width:14px; height:14px; border:2px solid #667eea; border-radius:50%;}
.dot.fill{background:#667eea;}
.hidden{display:none;}

/* Balloons */
.balloon{position:fixed; font-size:40px; animation: floatUp 6s linear infinite; z-index:1;}
@keyframes floatUp{ from{transform:translateY(100vh) rotate(0deg); opacity:1;} to{transform:translateY(-20vh) rotate(360deg); opacity:0;} }

/* Confetti */
.confetti{position:fixed; width:10px; height:10px; top:-10px; animation:fall 4s linear infinite; z-index:1;}
@keyframes fall{ to{transform:translateY(100vh) rotate(720deg); opacity:0;} }
</style>
</head>
<body>

<!-- PAGE 1: PASSWORD -->
<div class="box" id="p1">
  <div class="cake">🔒🐱</div>
  <h1>Enter a passcode</h1>
  <p>Ye surprise sirf Hussain ke liye hai 💜</p>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="keypad">
    <div class="key" onclick="add(1)">1</div><div class="key" onclick="add(2)">2</div><div class="key" onclick="add(3)">3</div>
    <div class="key" onclick="add(4)">4</div><div class="key" onclick="add(5)">5</div><div class="key" onclick="add(6)">6</div>
    <div class="key" onclick="add(7)">7</div><div class="key" onclick="add(8)">8</div><div class="key" onclick="add(9)">9</div>
    <div></div><div class="key" onclick="add(0)">0</div><div></div>
  </div>
  <button class="btn" onclick="check()">UNLOCK</button>
  <p id="err" style="color:red;"></p>
</div>

<!-- PAGE 2: BIRTHDAY 17 -->
<div class="box hidden" id="p2">
  <div class="cake">🎂</div>
  <h1>Happy 17th Birthday</h1>
  <div class="age">17</div>
  <p>To My Dear Hussain 🎉<br>
  May your 17th year be full of love, success, and endless happiness ❤️<br><br>
  You are growing into an amazing person. So proud of you!</p>
  <button class="btn" onclick="boom()">Celebrate 🎉</button>
</div>

<script>
let pass="";
function add(n){ if(pass.length<4){ pass+=n; update(); } }
function update(){ let d=document.querySelectorAll('.dot'); d.forEach((x,i)=>x.classList.toggle('fill', i<pass.length)); }

function createBalloons(){
  const emojis = ['🎈','🎈','🎈','🎉','✨'];
  for(let i=0;i<15;i++){
    let b = document.createElement('div');
    b.className = 'balloon';
    b.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];
    b.style.left = Math.random()*100 + 'vw';
    b.style.animationDelay = Math.random()*3 + 's';
    document.body.appendChild(b);
    setTimeout(()=>b.remove(), 6000);
  }
}

function createConfetti(){
  const colors = ['#667eea','#764ba2','#ff4d94','#ffc2e2','#fff'];
  for(let i=0;i<100;i++){
    let c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay = Math.random()*2 + 's';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 4000);
  }
}

function check(){ 
  if(pass=="1717"){ // Password 1717 rakha hai age ke hisab se
    createConfetti();
    setTimeout(()=>{
      document.getElementById('p1').classList.add('hidden');
      document.getElementById('p2').classList.remove('hidden');
      createBalloons();
    },500);
  }else{ 
    document.getElementById('err').innerText="Wrong! Try 1717"; 
    pass=""; update(); 
    setTimeout(()=>err.innerText="",2000); 
  } 
}

function boom(){
  createBalloons();
  createConfetti();
  alert("Happy 17th Birthday Hussain! 🎉🎂\nLove you bro ❤️");
}

// Load pe thore balloons
window.onload = ()=>{ createBalloons(); }
</script>
</body>
</html>
