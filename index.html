<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Jaan 🎂</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap');
  *{margin:0; padding:0; box-sizing:border-box;}
  body{
    font-family: 'Noto Nastaliq Urdu', serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
    height:100vh; display:flex; justify-content:center; align-items:center;
  }
.box{
    background: white; padding:35px 25px; border-radius:30px;
    box-shadow: 0 15px 50px rgba(255,77,109,0.4); border: 3px solid #ffdde1;
    text-align:center; width:90%; max-width:420px; min-height:450px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
.emoji{font-size:3.5em; margin-bottom:10px; animation: bounce 2s infinite;}
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
  h2{color:#d63384; font-size:1.6em; margin-bottom:15px;}
.shayari{color:#a61e4d; font-size:1.2em; line-height:2; margin-bottom:15px; font-weight:bold;}
.wish{color:#333; font-size:1.1em; line-height:1.8; background:#fff0f3; padding:12px; border-radius:15px; border:2px dashed #ff4d6d;}
.btn{
    margin-top:25px; padding:14px 40px; background: linear-gradient(135deg, #ff4d6d, #ff758f);
    color: white; border: none; border-radius: 50px; font-size: 1.2em; cursor: pointer;
    box-shadow: 0 5px 15px rgba(255,77,109,0.4); font-family: 'Noto Nastaliq Urdu';
  }
 input{
    padding:12px; border:2px solid #ff4d6d; border-radius:15px; font-size:1.1em;
    text-align:center; margin:15px 0; font-family: 'Noto Nastaliq Urdu';
  }
.hidden{display:none;}
</style>
</head>
<body>

<!-- PASSWORD PAGE -->
<div class="box" id="passwordPage">
  <div class="emoji">🔒</div>
  <h2>یہ Surprise صرف Jaan کے لیے ہے</h2>
  <p style="color:#666; margin-bottom:10px;">Password ڈالیں</p>
  <input type="password" id="passInput" placeholder="Password یہاں لکھیں">
  <button class="btn" onclick="checkPass()">کھولو ❤️</button>
  <p id="error" style="color:red; margin-top:10px;"></p>
</div>

<!-- MAIN PAGES -->
<div class="box hidden" id="mainPage">
  <div id="card"></div>
</div>

<script>
const correctPass = "Jaan"; // یہاں password ہے

const pages = [
  {emoji:"🎉", shayari:"چاند بھی شرما جائے تمہارے چہرے سے<br>تارے بھی جھلملائیں تمہاری باتوں سے", wish:"🎂 Happy Birthday Jaan! اللہ آپ کو ڈھیروں خوشیاں دے"},
  {emoji:"❤️", shayari:"تمہاری ایک مسکراہٹ کے لیے<br>میں دنیا سے لڑ جاؤں", wish:"🌹 آج کا دن آپ کے لیے خاص ہو، جیسے آپ میرے لیے خاص ہیں"},
  {emoji:"🌹", shayari:"تم ہو تو دنیا حسین لگتی ہے<br>تمہاری ہنسی سے بہار آتی ہے", wish:"✨ اللہ کرے آپ کی زندگی پھولوں جیسی مہکے"},
  {emoji:"💖", shayari:"تم بن زندگی ادھوری ہے<br>تم سے ہی میری تکمیل ہے", wish:"🎁 Jaan آپ کو Birthday کی ڈھیر ساری مبارک ہو"},
  {emoji:"🥰", shayari:"آپ کی آنکھوں میں جو نشہ ہے<br>وہ شراب میں کہاں", wish:"💫 اللہ آپ کی ہر دعا قبول کرے آمین"},
  {emoji:"🌸", shayari:"آپ کے ساتھ گزارا ہر لمحہ<br>میرے لیے سب سے قیمتی ہے", wish:"🎈 آج آپ کا دن ہے، جی بھر کر celebrate کریں"},
  {emoji:"💌", shayari:"آپ میری زندگی کی سب سے خوبصورت دعا ہیں<br>اللہ آپ کو سلامت رکھے", wish:"🎊 Happy Birthday! آپ ہمیشہ ایسے ہی ہنستے رہیں"},
  {emoji:"✨", shayari:"محبت کی انتہا کیا ہوگی<br>جب حد سے زیادہ چاہا تمہیں", wish:"❤️ Jaan آپ کے لیے دل سے دعا ہے، ہمیشہ خوش رہیں"},
  {emoji:"🎁", shayari:"آج کے دن آپ دنیا میں آئے<br>اور میری زندگی روشن کر دی", wish:"🌙 اللہ آپ کو صحت، عزت اور کامیابی دے"},
  {emoji:"💕", shayari:"تمہاری باتوں میں جو سکون ہے<br>وہ دنیا کی کسی کتاب میں نہیں", wish:"🎂 Birthday Mubarak Jaan! کیک کاٹنے کا وقت آ گیا"},
  {emoji:"🌙", shayari:"تمہارے نام سے میری پہچان ہے<br>تمہارے بغیر میں کچھ بھی نہیں", wish:"💝 اللہ آپ کو لمبی عمر اور بے شمار خوشیاں عطا کرے"},
  {emoji:"🎈", shayari:"آپ کی ہنسی میری خوشی ہے<br>آپ کا غم میرا غم ہے", wish:"🌟 Happy Birthday! آپ جیسا کوئی نہیں"},
  {emoji:"💫", shayari:"تم میرے خواب ہو، میری حقیقت ہو<br>تم ہی میری دنیا ہو", wish:"🎉 Jaan آج آپ کا دن ہے، انجوائے کریں"},
  {emoji:"🌷", shayari:"آپ کے لیے دل سے دعا نکلتی ہے<br>کہ آپ کو کبھی کوئی غم نہ چھوئے", wish:"❤️ Birthday Wishes! آپ ہمیشہ کامیاب ہوں"},
  {emoji:"💞", shayari:"I Love You Jaan<br>تم میری زندگی ہو", wish:"🎂🎉 Happy Birthday to the Best Person Ever! I Love You"}
];

let i = 0;

function checkPass(){
  const input = document.getElementById('passInput').value;
  if(input === correctPass){
    document.getElementById('passwordPage').classList.add('hidden');
    document.getElementById('mainPage').classList.remove('hidden');
    showPage();
  } else {
    document.getElementById('error').innerText = "غلط Password! 'Jaan' لکھیں";
  }
}

function showPage(){
  const p = pages[i];
  document.getElementById('card').innerHTML = `
    <div>
      <div class="emoji">${p.emoji}</div>
      <h2>صفحہ ${i+1}</h2>
      <div class="shayari">${p.shayari}</div>
      <div class="wish">${p.wish}</div>
    </div>
    <div>
      ${i < pages.length-1? `<button class="btn" onclick="nextPage()">اگلا صفحہ ➡️</button>` : `<button class="btn" onclick="alert('I Love You Jaan! ❤️🎊')">ختم 🎊</button>`}
      <div style="color:#999; font-size:0.9em; margin-top:10px;">${i+1} / ${pages.length}</div>
    </div>
  `;
}

function nextPage(){
  i++;
  showPage();
}

// Enter دبانے سے بھی password لگ جائے
document.getElementById('passInput').addEventListener('keypress', function(e){
  if(e.key === 'Enter') checkPass();
});
</script>
</body>
</html>
