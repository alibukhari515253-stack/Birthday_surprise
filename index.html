<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mere Jaan ke liye 🎂</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
  *{margin:0; padding:0; box-sizing:border-box;}
  body{
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
    height:100vh; display:flex; justify-content:center; align-items:center;
  }
.box{
    background: white; padding:35px 25px; border-radius:30px;
    box-shadow: 0 15px 50px rgba(255,77,109,0.4); border: 3px solid #ffdde1;
    text-align:center; width:90%; max-width:420px; min-height:450px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
.emoji{font-size:3.5em; margin-bottom:10px; animation: bounce 2s infinite;}
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
  h2{color:#d63384; font-size:1.6em; margin-bottom:15px;}
.shayari{color:#a61e4d; font-size:1.2em; line-height:2; margin-bottom:15px; font-weight:bold;}
.wish{color:#333; font-size:1.1em; line-height:1.8; background:#fff0f3; padding:12px; border-radius:15px; border:2px dashed #ff4d6d;}
.btn{
    margin-top:25px; padding:14px 40px; background: linear-gradient(135deg, #ff4d6d, #ff758f);
    color: white; border: none; border-radius: 50px; font-size: 1.2em; cursor: pointer;
    box-shadow: 0 5px 15px rgba(255,77,109,0.4); font-family: 'Poppins';
  }
 input{
    padding:12px; border:2px solid #ff4d6d; border-radius:15px; font-size:1.1em;
    text-align:center; margin:15px 0; font-family: 'Poppins';
  }
.hidden{display:none;}
</style>
</head>
<body>

<!-- PASSWORD PAGE - GF BOL RAHI -->
<div class="box" id="passwordPage">
  <div class="emoji">🔒💌</div>
  <h2>Ye surprise sirf mere pagal Jaan ke liye hai 😜</h2>
  <p style="color:#666; margin-bottom:10px;">Main ne raat jaag kar aap ke liye banaya hai<br>Password daal kar kholo na</p>
  <input type="password" id="passInput" placeholder="Enter Password">
  <button class="btn" onclick="checkPass()">Kholo mere Jaan ❤️</button>
  <p id="error" style="color:red; margin-top:10px;"></p>
</div>

<!-- MAIN PAGES -->
<div class="box hidden" id="mainPage">
  <div id="card"></div>
</div>

<script>
const correctPass = "jann"; // Password hidden hai

const pages = [
  {emoji:"🎉", shayari:"Mere pagal Jaan<br>Chaand bhi sharma jaye aap ke chehre se", wish:"🎂 Happy Birthday mere Jaan! Aaj ka din aap ka hai aur aap sirf mere hain"},
  {emoji:"❤️", shayari:"Aap ki ek muskurahat ke liye<br>Main is poori duniya se lar jaaon", wish:"🌹 Aaj ka din aap ke liye jitna khaas hai, aap mere liye us se bhi zyada khaas hain"},
  {emoji:"🌹", shayari:"Aap ho to meri duniya haseen lagti hai<br>Aap hanste ho to mera dil baagh ho jata hai", wish:"✨ Allah kare mera Jaan hamesha aise hi khush rahe Ameen"},
  {emoji:"💖", shayari:"Aap ke baghair main adhoori hun Jaan<br>Aap se hi to meri zindagi mukammal hai", wish:"🎁 Happy Birthday mere pagal! Ye chota sa tohfa meri taraf se qubool kar lein"},
  {emoji:"🥰", shayari:"Aap ki aankhon me jo nasha hai na<br>Wo sharaab me bhi nahi milta", wish:"💫 Allah meri har dua me aap ko maangti hun. Happy Birthday Jaan"},
  {emoji:"🌸", shayari:"Aap ke sath guzara har ek lamha<br>Mere liye sone se bhi qeemti hai", wish:"🎈 Aaj aap ka din hai mere shehzade, ji bhar kar cake khao"},
  {emoji:"💌", shayari:"Aap meri sab se khoobsurat dua hain<br>Allah mere Jaan ko salamat rakhe", wish:"🎊 Happy Birthday! Aap aise hi hanste rahein aur main aap ko dekhti rahun"},
  {emoji:"✨", shayari:"Mohabbat ki inteha poochte hain log<br>Main kehti hun hadd se zyada chaha hai tumhe", wish:"❤️ Jaan aap ke baghair mera koi din poora nahi hota"},
  {emoji:"🎁", shayari:"Jis din aap paida hue the na<br>Us din Allah ne mujhe mera sab se qeemti tohfa diya tha", wish:"🌙 Allah mere Jaan ko sehat, izzat aur kamyabi de. Ameen"},
  {emoji:"💕", shayari:"Aap ki baaton me jo sukoon hai<br>Wo mujhe duniya ki kisi cheez me nahi milta", wish:"🎂 Birthday Mubarak mere Jaan! Cake kato aur mujhe pehla tukra bhejna"},
  {emoji:"🌙", shayari:"Log poochte hain meri pehchan kya hai<br>Main kehti hun main falan ki Jaan hun", wish:"💝 Allah aap ko lambi umar de aur hamesha mere sath rakhe"},
  {emoji:"🎈", shayari:"Aap ki hansi = meri khushi<br>Aap ka gham = mera gham", wish:"🌟 Happy Birthday mere hero! Aap jaisa koi nahi aur na hoga"},
  {emoji:"💫", shayari:"Aap mere khwab the<br>Aap meri haqeeqat ban gaye<br>Aap hi meri duniya hain", wish:"🎉 Jaan aaj celebrate karo. Main dil se aap ke sath hun"},
  {emoji:"🌷", shayari:"Main roz dua karti hun<br>Ke Allah mere Jaan ko koi gham na de", wish:"❤️ Birthday Wishes! Aap hamesha kamyab hon. Love You So Much"},
  {emoji:"💞", shayari:"I Love You mere Jaan<br>Aap meri saans hain<br>Aap ke baghair main mar jaaon", wish:"🎂🎉 Happy Birthday to the Best Boyfriend in the World! I Love You Endless ❤️\n\n- Aap ki pagal GF"}
];

let i = 0;

function checkPass(){
  const input = document.getElementById('passInput').value;
  if(input === correctPass){
    document.getElementById('passwordPage').classList.add('hidden');
    document.getElementById('mainPage').classList.remove('hidden');
    showPage();
  } else {
    document.getElementById('error').innerText = "Arre galat password! Phir se try karo 😅";
  }
}

function showPage(){
  const p = pages[i];
  document.getElementById('card').innerHTML = `
    <div>
      <div class="emoji">${p.emoji}</div>
      <h2>Page ${i+1}</h2>
      <div class="shayari">${p.shayari}</div>
      <div class="wish">${p.wish}</div>
    </div>
    <div>
      ${i < pages.length-1? `<button class="btn" onclick="nextPage()">Next Page ➡️</button>` : `<button class="btn" onclick="alert('I Love You So Much mere Jaan! ❤️🎊\n\n- Aap ki pagal GF')">Khatam 🎊</button>`}
      <div style="color:#999; font-size:0.9em; margin-top:10px;">${i+1} / ${pages.length}</div>
    </div>
  `;
}

function nextPage(){
  i++;
  showPage();
}

document.getElementById('passInput').addEventListener('keypress', function(e){
  if(e.key === 'Enter') checkPass();
});
</script>
</body>
</html>
