<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaan کے لیے Birthday 🎂</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap');
  body {font-family: 'Noto Nastaliq Urdu', serif; background: linear-gradient(135deg, #ffdde1, #ee9ca7); height: 100vh; margin:0; display:flex; justify-content:center; align-items:center; text-align:center; padding:20px;}
  .page {display:none;}
  .page.active {display:block;}
  h1 {font-size: 2.2em; color: #d63384;}
  p {font-size: 1.3em; color: #333; line-height: 2;}
  button {margin-top: 30px; padding: 12px 35px; background: #ff4d6d; color: white; border: none; border-radius: 50px; font-size: 1.2em; cursor: pointer;}
</style>
</head>
<body>

<div class="page active" id="p1">
  <h1>❤️ Assalamualaikum Jaan</h1>
  <p>آج کا دن بہت خاص ہے<br>کیونکہ آج آپ کا Birthday ہے 🎉</p>
  <button onclick="show(2)">اگلا صفحہ</button>
</div>

<div class="page" id="p2">
  <h1>آپ کے لیے</h1>
  <p>تم ہو تو دنیا حسین لگتی ہے<br>تمہاری ہنسی سے بہار آتی ہے</p>
  <button onclick="show(3)">اگلا</button>
</div>

<div class="page" id="p3">
  <h1>I Love You Jaan ❤️</h1>
  <p>یہ چھوٹا سا تحفہ آپ کے نام</p>
  <button onclick="alert('Happy Birthday Jaan! 🎊')">پارٹی پوپر</button>
</div>

<script>
function show(n){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('p'+n).classList.add('active');
}
</script>
</body>
</html>
