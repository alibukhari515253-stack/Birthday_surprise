<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaan کے لیے میرا تحفہ 🎂</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap');
  *{margin:0; padding:0; box-sizing:border-box;}
  body{
    font-family: 'Noto Nastaliq Urdu', serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
    height:100vh; display:flex; justify-content:center; align-items:center;
  }
.box{
    background: white; padding:35px 25px; border-radius:30px;
    box-shadow: 0 15px 50px rgba(255,77,109,0.4); border: 3px solid #ffdde1;
    text-align:center; width:90%; max-width:420px; min-height:450px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
.emoji{font-size:3.5em; margin-bottom:10px; animation: bounce 2s infinite;}
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
  h2{color:#d63384; font-size:1.6em; margin-bottom:15px;}
.shayari{color:#a61e4d; font-size:1.2em; line-height:2; margin-bottom:15px; font-weight:bold;}
.wish{color:#333; font-size:1.1em; line-height:1.8; background:#fff0f3; padding:12px; border-radius:15px; border:2px dashed #ff4d6d;}
.btn{
    margin-top:25px; padding:14px 40px; background: linear-gradient(135deg, #ff4d6d, #ff758f);
    color: white; border: none; border-radius: 50px; font-size: 1.2em; cursor: pointer;
    box-shadow: 0 5px 15px rgba(255,77,109,0.4); font-family: 'Noto Nastaliq Urdu';
  }
 input{
    padding:12px; border:2px solid #ff4d6d; border-radius:15px; font-size:1.1em;
    text-align:center; margin:15px 0; font-family: 'Noto Nastaliq Urdu';
  }
.hidden{display:none;}
</style>
</head>
<body>

<!-- PASSWORD PAGE - LARKI BOL RAHI -->
<div class="box" id="passwordPage">
  <div class="emoji">🔒💌</div>
  <h2>یہ سرپرائز صرف میرے Jaan کے لیے ہے</h2>
  <p style="color:#666; margin-bottom:10px;">میں نے آپ کے لیے خاص بنایا ہے<br>Password ڈال کر کھولیں</p>
  <input type="password" id="passInput" placeholder="Password: Jaan">
  <button class="btn" onclick="checkPass()">کھولو میرے Jaan ❤️</button>
  <p id="error" style="color:red; margin-top:10px;"></p>
</div>

<!-- MAIN PAGES -->
<div class="box hidden" id="mainPage">
  <div id="card"></div>
</div>

<script>
const correctPass = "Jaan"; // Password

const pages = [
  {emoji:"🎉", shayari:"چاند بھی شرما جائے آپ کے چہرے سے<br>تارے بھی جھلملائیں آپ کی باتوں سے", wish:"🎂 Happy Birthday Jaan! آج کا دن آپ کا ہے اور آپ میرے ہیں"},
  {emoji:"❤️", shayari:"آپ کی ایک مسکراہٹ کے لیے<br>میں دنیا سے لڑ جاؤں", wish:"🌹 آج کا دن آپ کے لیے خاص ہو، جیسے آپ میرے لیے خاص ہیں"},
  {emoji:"🌹", shayari:"آپ ہو تو دنیا حسین لگتی ہے<br>آپ کی ہنسی سے بہار آتی ہے", wish:"✨ اللہ کرے آپ کی زندگی پھولوں جیسی مہکے"},
  {emoji:"💖", shayari:"آپ کے بغیر زندگی ادھوری ہے<br>آپ سے ہی میری تکمیل ہے", wish:"🎁 Jaan آپ کو میری طرف سے Birthday کی ڈھیر ساری مبارک ہو"},
  {emoji:"🥰", shayari:"آپ کی آنکھوں میں جو نشہ ہے<br>وہ شراب میں کہاں", wish:"💫 اللہ آپ کی ہر دعا قبول کرے آمین۔ یہ میری دعا ہے"},
  {emoji:"🌸", shayari:"آپ کے ساتھ گزارا ہر لمحہ<br>میرے لیے سب سے قیمتی ہے", wish:"🎈 آج آپ کا دن ہے Jaan، جی بھر کر celebrate کریں"},
  {emoji:"💌", shayari:"آپ میری زندگی کی سب سے خوبصورت دعا ہیں<br>اللہ آپ کو سلامت رکھے", wish:"🎊 Happy Birthday! آپ ہمیشہ ایسے ہی ہنستے رہیں۔ میں دیکھتی رہوں"},
  {emoji:"✨", shayari:"محبت کی انتہا کیا ہوگی<br>جب حد سے زیادہ چاہا آپ کو", wish:"❤️ Jaan آپ کے لیے دل سے دعا ہے، ہمیشہ خوش رہیں"},
  {emoji:"🎁", shayari:"جس دن آپ دنیا میں آئے<br>اس دن میری زندگی روشن ہو گئی", wish:"🌙 اللہ آپ کو صحت، عزت اور کامیابی دے۔ آمین"},
  {emoji:"💕", shayari:"آپ کی باتوں میں جو سکون ہے<br>وہ دنیا کی کسی کتاب میں نہیں", wish:"🎂 Birthday Mubarak Jaan! کیک کاٹیں اور مجھے یاد رکھیں"},
  {emoji:"🌙", shayari:"آپ کے نام سے میری پہچان ہے<br>آپ کے بغیر میں کچھ بھی نہیں", wish:"💝 اللہ آپ کو لمبی عمر اور بے شمار خوشیاں عطا کرے"},
  {emoji:"🎈", shayari:"آپ کی ہنسی میری خوشی ہے<br>آپ کا غم میرا غم ہے", wish:"🌟 Happy Birthday Jaan! آپ جیسا کوئی نہیں اور نہ ہوگا"},
  {emoji:"💫", shayari:"آپ میرے خواب ہو، میری حقیقت ہو<br>آپ ہی میری دنیا ہو", wish:"🎉 Jaan آج آپ کا دن ہے، انجوائے کریں۔ میں آپ کے ساتھ ہوں"},
  {emoji:"🌷", shayari:"آپ کے لیے دل سے دعا نکلتی ہے<br>کہ آپ کو کبھی کوئی غم نہ چھوئے", wish:"❤️ Birthday Wishes! آپ ہمیشہ کامیاب ہوں۔ Love You"},
  {emoji:"💞", shayari:"I Love You Jaan<br>آپ میری زندگی ہیں<br>آپ کے بغیر میں کچھ نہیں", wish:"🎂🎉 Happy Birthday to the Best Boyfriend Ever! I Love You So Much ❤️"}
];

let i = 0;

function checkPass(){
  const input = document.getElementById('passInput').value;
  if(input === correctPass){
    document.getElementById('passwordPage').classList.add('hidden');
    document.getElementById('mainPage').classList.remove('hidden');
    showPage();
  } else {
    document.getElementById('error').innerText = "ارے غلط Password! 'Jaan' لکھیں نا 😅";
  }
}

function showPage(){
  const p = pages[i];
  document.getElementById('card').innerHTML = `
    <div>
      <div class="emoji">${p.emoji}</div>
      <h2>صفحہ ${i+1}</h2>
      <div class="shayari">${p.shayari}</div>
      <div class="wish">${p.wish}</div>
    </div>
    <div>
      ${i < pages.length-1? `<button class="btn" onclick="nextPage()">اگلا صفحہ ➡️</button>` : `<button class="btn" onclick="alert('I Love You So Much Jaan! ❤️🎊\n\n- آپ کی')">ختم 🎊</button>`}
      <div style="color:#999; font-size:0.9em; margin-top:10px;">${i+1} / ${pages.length}</div>
    </div>
  `;
}

function nextPage(){
  i++;
  showPage();
}

document.getElementById('passInput').addEventListener('keypress', function(e){
  if(e.key === 'Enter') checkPass();
});
</script>
</body>
</html>
