<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>میرے Jaan کے لیے 🎂</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap');
  *{margin:0; padding:0; box-sizing:border-box;}
  body{
    font-family: 'Noto Nastaliq Urdu', serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
    height:100vh; display:flex; justify-content:center; align-items:center;
  }
.box{
    background: white; padding:35px 25px; border-radius:30px;
    box-shadow: 0 15px 50px rgba(255,77,109,0.4); border: 3px solid #ffdde1;
    text-align:center; width:90%; max-width:420px; min-height:450px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
.emoji{font-size:3.5em; margin-bottom:10px; animation: bounce 2s infinite;}
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
  h2{color:#d63384; font-size:1.6em; margin-bottom:15px;}
.shayari{color:#a61e4d; font-size:1.2em; line-height:2; margin-bottom:15px; font-weight:bold;}
.wish{color:#333; font-size:1.1em; line-height:1.8; background:#fff0f3; padding:12px; border-radius:15px; border:2px dashed #ff4d6d;}
.btn{
    margin-top:25px; padding:14px 40px; background: linear-gradient(135deg, #ff4d6d, #ff758f);
    color: white; border: none; border-radius: 50px; font-size: 1.2em; cursor: pointer;
    box-shadow: 0 5px 15px rgba(255,77,109,0.4); font-family: 'Noto Nastaliq Urdu';
  }
 input{
    padding:12px; border:2px solid #ff4d6d; border-radius:15px; font-size:1.1em;
    text-align:center; margin:15px 0; font-family: 'Noto Nastaliq Urdu';
  }
.hidden{display:none;}
</style>
</head>
<body>

<!-- PASSWORD PAGE - GF BOL RAHI -->
<div class="box" id="passwordPage">
  <div class="emoji">🔒💌</div>
  <h2>یہ سرپرائز صرف میرے پاگل Jaan کے لیے ہے 😜</h2>
  <p style="color:#666; margin-bottom:10px;">میں نے رات جاگ کر آپ کے لیے بنایا ہے<br>Password ڈال کر کھولو نا</p>
  <input type="password" id="passInput" placeholder="Password: jann">
  <button class="btn" onclick="checkPass()">کھولو میرے Jaan ❤️</button>
  <p id="error" style="color:red; margin-top:10px;"></p>
</div>

<!-- MAIN PAGES -->
<div class="box hidden" id="mainPage">
  <div id="card"></div>
</div>

<script>
const correctPass = "jann"; // Password chota jann

const pages = [
  {emoji:"🎉", shayari:"میرے پاگل Jaan<br>چاند بھی شرما جائے آپ کے چہرے سے", wish:"🎂 Happy Birthday mere Jaan! آج کا دن آپ کا ہے اور آپ صرف میرے ہیں"},
  {emoji:"❤️", shayari:"آپ کی ایک مسکراہٹ کے لیے<br>میں اس پوری دنیا سے لڑ جاؤں", wish:"🌹 آج کا دن آپ کے لیے جتنا خاص ہے، آپ میرے لیے اس سے بھی زیادہ خاص ہیں"},
  {emoji:"🌹", shayari:"آپ ہو تو میری دنیا حسین لگتی ہے<br>آپ ہنستے ہو تو میرا دل باغ ہو جاتا ہے", wish:"✨ اللہ کرے میرا Jaan ہمیشہ ایسے ہی خوش رہے آمین"},
  {emoji:"💖", shayari:"آپ کے بغیر میں ادھوری ہوں Jaan<br>آپ سے ہی تو میری زندگی مکمل ہے", wish:"🎁 Happy Birthday mere pagal! یہ چھوٹا سا تحفہ میری طرف سے قبول کر لیں"},
  {emoji:"🥰", shayari:"آپ کی آنکھوں میں جو نشہ ہے نا<br>وہ شراب میں بھی نہیں ملتا", wish:"💫 اللہ میری ہر دعا میں آپ کو مانگتی ہوں۔ Happy Birthday Jaan"},
  {emoji:"🌸", shayari:"آپ کے ساتھ گزارا ہر ایک لمحہ<br>میرے لیے سونے سے بھی قیمتی ہے", wish:"🎈 آج آپ کا دن ہے میرے شہزادے، جی بھر کر کیک کھائیں"},
  {emoji:"💌", shayari:"آپ میری سب سے خوبصورت دعا ہیں<br>اللہ میرے Jaan کو سلامت رکھے", wish:"🎊 Happy Birthday! آپ ایسے ہی ہنستے رہیں اور میں آپ کو دیکھتی رہوں"},
  {emoji:"✨", shayari:"محبت کی انتہا پوچھتے ہیں لوگ<br>میں کہتی ہوں حد سے زیادہ چاہا ہے تمہیں", wish:"❤️ Jaan آپ کے بغیر میرا کوئی دن پورا نہیں ہوتا"},
  {emoji:"🎁", shayari:"جس دن آپ پیدا ہوئے تھے نا<br>اس دن اللہ نے مجھے میرا سب سے قیمتی تحفہ دیا تھا", wish:"🌙 اللہ میرے Jaan کو صحت، عزت اور کامیابی دے۔ آمین"},
  {emoji:"💕", shayari:"آپ کی باتوں میں جو سکون ہے<br>وہ مجھے دنیا کی کسی چیز میں نہیں ملتا", wish:"🎂 Birthday Mubarak mere Jaan! کیک کاٹو اور مجھے پہلا ٹکڑا بھیجنا"},
  {emoji:"🌙", shayari:"لوگ پوچھتے ہیں میری پہچان کیا ہے<br>میں کہتی ہوں میں فلاں کی Jaan ہوں", wish:"💝 اللہ آپ کو لمبی عمر دے اور ہمیشہ میرے ساتھ رکھے"},
  {emoji:"🎈", shayari:"آپ کی ہنسی = میری خوشی<br>آپ کا غم = میرا غم", wish:"🌟 Happy Birthday mere hero! آپ جیسا کوئی نہیں اور نہ ہوگا"},
  {emoji:"💫", shayari:"آپ میرے خواب تھے<br>آپ میری حقیقت بن گئے<br>آپ ہی میری دنیا ہیں", wish:"🎉 Jaan آج celebrate کرو۔ میں دل سے آپ کے ساتھ ہوں"},
  {emoji:"🌷", shayari:"میں روز دعا کرتی ہوں<br>کہ اللہ میرے Jaan کو کوئی غم نہ دے", wish:"❤️ Birthday Wishes! آپ ہمیشہ کامیاب ہوں۔ Love You So Much"},
  {emoji:"💞", shayari:"I Love You mere Jaan<br>آپ میری سانس ہیں<br>آپ کے بغیر میں مر جاؤں", wish:"🎂🎉 Happy Birthday to the Best Boyfriend in the World! I Love You Endless ❤️\n\n- آپ کی پاگل GF"}
];

let i = 0;

function checkPass(){
  const input = document.getElementById('passInput').value;
  if(input === correctPass){
    document.getElementById('passwordPage').classList.add('hidden');
    document.getElementById('mainPage').classList.remove('hidden');
    showPage();
  } else {
    document.getElementById('error').innerText = "ارے پاگل! Password 'jann' ہے 😅 چھوٹے j سے";
  }
}

function showPage(){
  const p = pages[i];
  document.getElementById('card').innerHTML = `
    <div>
      <div class="emoji">${p.emoji}</div>
      <h2>صفحہ ${i+1}</h2>
      <div class="shayari">${p.shayari}</div>
      <div class="wish">${p.wish}</div>
    </div>
    <div>
      ${i < pages.length-1? `<button class="btn" onclick="nextPage()">اگلا صفحہ ➡️</button>` : `<button class="btn" onclick="alert('I Love You So Much mere Jaan! ❤️🎊\n\n- آپ کی پاگل GF')">ختم 🎊</button>`}
      <div style="color:#999; font-size:0.9em; margin-top:10px;">${i+1} / ${pages.length}</div>
    </div>
  `;
}

function nextPage(){
  i++;
  showPage();
}

document.getElementById('passInput').addEventListener('keypress', function(e){
  if(e.key === 'Enter') checkPass();
});
</script>
</body>
</html>
